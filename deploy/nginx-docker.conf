# =============================================================================
#  Impera's Lab — Nginx dentro del contenedor Docker (detrás de Traefik)
#  Destino: /etc/nginx/conf.d/default.conf
# =============================================================================

# Rate limit para el formulario de leads (10 req/min por IP)
limit_req_zone $binary_remote_addr zone=leadform:10m rate=10r/m;

# 1. Redirección www -> dominio principal
server {
    listen 80;
    listen [::]:80;
    server_name www.imperaslab.com.br;

    return 301 https://imperaslab.com.br$request_uri;
}

# 2. Servidor principal de la landing
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name imperaslab.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Seguridad ----------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # ---- Compresión Gzip -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml application/xml application/xml+rss
        application/javascript application/json image/svg+xml
        font/woff font/woff2 application/font-woff application/font-woff2;

    # ---- Formulario de leads -> Webhook de n8n ------------------------------
    # El navegador envía a https://imperaslab.com.br/api/contato (mismo origen,
    # sin problemas de CORS) y Nginx lo reenvía a n8n.
    location = /api/contato {
        limit_req zone=leadform burst=5 nodelay;
        limit_except POST OPTIONS { deny all; }

        proxy_pass https://n8n.imperaslab.com.br/webhook/contacto-lead;
        proxy_ssl_server_name on;
        proxy_set_header Host              n8n.imperaslab.com.br;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Origin-Host     $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_intercept_errors off;
    }

    # ---- Assets con hash (Astro): Caché inmutable (1 año) -------------------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- HTML: Revalidar siempre -------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---- Enrutamiento Astro (formato 'file') ---------------------------------
    # /politica-de-privacidade busca /politica-de-privacidade.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Página 404 personalizada generada por Astro
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Bloquear acceso a archivos ocultos (ej. .git, .env)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
